<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="restore-adoption-title restore-adoption-desc">
  <title id="restore-adoption-title">Isolated restore and explicit adoption</title><desc id="restore-adoption-desc">A portable bundle restores into a job-owned isolated result; verification is followed either by deletion through the owning job or by an explicit copy into operator-owned storage before activation.</desc>
  <defs><marker id="ra-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="ra-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker><style>.n{font:600 12px Geist,Arial,sans-serif;fill:#2d3142}.s{font:9px 'Geist Mono',monospace;fill:#4f5d75}.b{fill:#f5f5f5;stroke:#4f5d75;stroke-width:1}.a{fill:rgba(191,69,32,.08);stroke:#bf4520;stroke-width:1.2}.e{font:8px 'Geist Mono',monospace;fill:#5a6580;letter-spacing:1px}.z{fill:#2d3142;fill-opacity:.02;stroke:#2d3142;stroke-opacity:.18}</style></defs><rect width="1280" height="720" fill="#f5f5f5"/><rect class="z" x="300" y="112" width="500" height="432" rx="8"/><text class="e" x="324" y="140">JOB-OWNED STORAGE</text><rect class="z" x="824" y="112" width="416" height="432" rx="8"/><text class="e" x="848" y="140">OPERATOR-OWNED STORAGE</text>
  <line x1="248" y1="320" x2="336" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ra-arrow)"/><line x1="536" y1="320" x2="600" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ra-arrow)"/><line x1="668" y1="256" x2="668" y2="224" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ra-arrow)"/><path d="M732 384 V440 Q732 448 740 448 H824" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#ra-accent)"/><line x1="1024" y1="448" x2="1048" y2="448" stroke="#bf4520" stroke-width="1.2" marker-end="url(#ra-accent)"/>
  <rect class="b" x="48" y="256" width="200" height="128" rx="6"/><text class="n" x="148" y="310" text-anchor="middle">Portable bundle</text><text class="s" x="148" y="340" text-anchor="middle">catalog + originals</text>
  <rect class="b" x="336" y="256" width="200" height="128" rx="6"/><text class="n" x="436" y="310" text-anchor="middle">Restore result</text><text class="s" x="436" y="340" text-anchor="middle">JOB.restored/store</text>
  <rect class="a" x="600" y="256" width="200" height="128" rx="6"/><text class="n" x="700" y="310" text-anchor="middle">Verify copy</text><text class="s" x="700" y="340" text-anchor="middle">isolated · inactive</text>
  <rect class="b" x="568" y="160" width="200" height="64" rx="6"/><text class="n" x="668" y="188" text-anchor="middle">Delete job</text><text class="s" x="668" y="210" text-anchor="middle">removes result</text>
  <rect class="b" x="824" y="400" width="200" height="96" rx="6"/><text class="n" x="924" y="442" text-anchor="middle">Copy/adopt</text><text class="s" x="924" y="468" text-anchor="middle">outside job path</text>
  <rect class="b" x="1048" y="400" width="168" height="96" rx="6"/><text class="n" x="1132" y="442" text-anchor="middle">Activate</text><text class="s" x="1132" y="468" text-anchor="middle">explicit config</text>
  <line x1="40" y1="612" x2="1240" y2="612" stroke="#2d3142" stroke-opacity=".15"/><text class="e" x="64" y="648">RESTORE NEVER REPLACES ACTIVE STATE</text><text class="e" x="644" y="648">ADOPT BEFORE DELETE</text>
</svg>
