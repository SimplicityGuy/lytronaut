<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="system-architecture-title system-architecture-desc">
  <title id="system-architecture-title">Lytronaut system architecture</title>
  <desc id="system-architecture-desc">A browser Rust and WebAssembly client calls the loopback or reverse-proxied Rust service, which coordinates durable jobs, a SQLite or PostgreSQL catalog, and immutable original blobs.</desc>
  <defs><marker id="sa-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="sa-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker><style>.n{font:600 12px Geist,Arial,sans-serif;fill:#2d3142}.s{font:9px 'Geist Mono',monospace;fill:#4f5d75}.b{fill:#f5f5f5;stroke:#4f5d75;stroke-width:1}.a{fill:rgba(191,69,32,.08);stroke:#bf4520;stroke-width:1.2}.e{font:8px 'Geist Mono',monospace;fill:#5a6580;letter-spacing:1px}.z{fill:#2d3142;fill-opacity:.02;stroke:#2d3142;stroke-opacity:.18}</style></defs>
  <rect width="1280" height="720" fill="#f5f5f5"/><rect class="z" x="40" y="96" width="1200" height="500" rx="8"/><text class="e" x="64" y="124">APPLICATION BOUNDARY</text>
  <line x1="264" y1="336" x2="392" y2="336" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#sa-link)"/><line x1="600" y1="336" x2="696" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sa-arrow)"/>
  <path d="M896 320 H960 Q968 320 968 312 V232 Q968 224 976 224 H1016" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sa-arrow)"/><path d="M896 352 H960 Q968 352 968 360 V448 Q968 456 976 456 H1016" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sa-arrow)"/>
  <rect class="b" x="64" y="268" width="200" height="136" rx="6"/><text class="n" x="164" y="326" text-anchor="middle">Browser client</text><text class="s" x="164" y="354" text-anchor="middle">Rust / WASM</text>
  <rect class="a" x="392" y="268" width="208" height="136" rx="6"/><text class="n" x="496" y="326" text-anchor="middle">HTTP service</text><text class="s" x="496" y="354" text-anchor="middle">Axum / Tokio</text>
  <rect class="b" x="696" y="268" width="200" height="136" rx="6"/><text class="n" x="796" y="326" text-anchor="middle">Durable jobs</text><text class="s" x="796" y="354" text-anchor="middle">intake · export · restore</text>
  <rect class="b" x="1016" y="164" width="200" height="120" rx="6"/><text class="n" x="1116" y="216" text-anchor="middle">Catalog</text><text class="s" x="1116" y="244" text-anchor="middle">SQLite or PostgreSQL</text>
  <rect class="b" x="1016" y="396" width="200" height="120" rx="6"/><text class="n" x="1116" y="448" text-anchor="middle">Original blobs</text><text class="s" x="1116" y="476" text-anchor="middle">verified · read-only</text>
  <line x1="40" y1="632" x2="1240" y2="632" stroke="#2d3142" stroke-opacity=".15"/><text class="e" x="64" y="664">BLUE: HTTP/API</text><text class="e" x="280" y="664">CORAL: PRIMARY INTEGRATION</text><text class="e" x="596" y="664">ORIGINALS ARE NEVER REPLACED</text>
</svg>
