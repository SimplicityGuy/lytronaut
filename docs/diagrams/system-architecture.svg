<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="system-architecture-html-title system-architecture-html-desc" id="system-architecture-root"><title id="system-architecture-html-title">Lytronaut system architecture</title><desc id="system-architecture-html-desc">The Rust and WebAssembly browser client calls the Rust service, which coordinates jobs, a SQLite or PostgreSQL catalog, and immutable original blobs.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #system-architecture-root { color: #2d3142; font-family: Geist,Arial,sans-serif; }
      #system-architecture-root .sub { color:#4f5d75;margin:0 0 24px }
      #system-architecture-root .scroll { overflow-x:auto }
      #system-architecture-root .n { font:600 12px Geist,Arial,sans-serif;fill:#2d3142 }
      #system-architecture-root .s, #system-architecture-root .e { font:9px 'Geist Mono',monospace;fill:#4f5d75 }
      #system-architecture-root .e { font-size:8px;letter-spacing:1px }
      #system-architecture-root .b { fill:#f5f5f5;stroke:#4f5d75;stroke-width:1 }
      #system-architecture-root .a { fill:rgba(191,69,32,.08);stroke:#bf4520;stroke-width:1.2 }
      #system-architecture-root .scroll { overflow:visible }</style><marker id="system-architecture-sah-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4f5d75"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><line x1="264" y1="336" x2="392" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#system-architecture-sah-a)"/><line x1="600" y1="336" x2="696" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#system-architecture-sah-a)"/><path d="M896 312H960Q968 312 968 304V232Q968 224 976 224H1016" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#system-architecture-sah-a)"/><path d="M896 360H960Q968 360 968 368V448Q968 456 976 456H1016" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#system-architecture-sah-a)"/><g><rect class="b" x="64" y="268" width="200" height="136" rx="6"/><text class="n" x="164" y="326" text-anchor="middle">Browser client</text><text class="s" x="164" y="354" text-anchor="middle">Rust / WASM</text><rect class="a" x="392" y="268" width="208" height="136" rx="6"/><text class="n" x="496" y="326" text-anchor="middle">HTTP service</text><text class="s" x="496" y="354" text-anchor="middle">Axum / Tokio</text><rect class="b" x="696" y="264" width="200" height="144" rx="6"/><text class="n" x="796" y="326" text-anchor="middle">Durable jobs</text><text class="s" x="796" y="354" text-anchor="middle">intake · export · restore</text><rect class="b" x="1016" y="164" width="200" height="120" rx="6"/><text class="n" x="1116" y="216" text-anchor="middle">Catalog</text><text class="s" x="1116" y="244" text-anchor="middle">SQLite or PostgreSQL</text><rect class="b" x="1016" y="396" width="200" height="120" rx="6"/><text class="n" x="1116" y="448" text-anchor="middle">Original blobs</text><text class="s" x="1116" y="476" text-anchor="middle">verified · read-only</text></g><line x1="40" y1="632" x2="1240" y2="632" stroke="#2d3142" opacity=".15"/><text class="e" x="64" y="664">CORAL: PRIMARY INTEGRATION · ORIGINALS ARE NEVER REPLACED</text></svg>
