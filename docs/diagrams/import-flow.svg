<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="import-flow-html-title import-flow-html-desc" id="import-flow-root"><title id="import-flow-html-title">Immutable import flow</title><desc id="import-flow-html-desc">Selected source files pass bounded intake into immutable blobs and a sealed manifest before transactional catalog adaptation.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #import-flow-root { color: #2d3142; font-family: Geist,Arial,sans-serif; }
      #import-flow-root .sub { color:#4f5d75 }
      #import-flow-root .scroll { overflow-x:auto }
      #import-flow-root .n { font:600 12px Geist,Arial,sans-serif;fill:#2d3142 }
      #import-flow-root .s, #import-flow-root .e { font:9px 'Geist Mono',monospace;fill:#4f5d75 }
      #import-flow-root .e { font-size:8px;letter-spacing:1px }
      #import-flow-root .b { fill:#f5f5f5;stroke:#4f5d75;stroke-width:1 }
      #import-flow-root .a { fill:rgba(191,69,32,.08);stroke:#bf4520;stroke-width:1.2 }
      #import-flow-root .scroll { overflow:visible }</style><marker id="import-flow-ifh-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4f5d75"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><line x1="240" y1="320" x2="296" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#import-flow-ifh-a)"/><line x1="496" y1="320" x2="552" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#import-flow-ifh-a)"/><line x1="752" y1="320" x2="808" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#import-flow-ifh-a)"/><line x1="1008" y1="320" x2="1064" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#import-flow-ifh-a)"/><g><rect class="b" x="40" y="248" width="200" height="144" rx="6"/><text class="n" x="140" y="308" text-anchor="middle">Selected source</text><text class="s" x="140" y="338" text-anchor="middle">directory or ZIP</text><rect class="a" x="296" y="248" width="200" height="144" rx="6"/><text class="n" x="396" y="308" text-anchor="middle">Bounded intake</text><text class="s" x="396" y="338" text-anchor="middle">quota · stream · verify</text><rect class="b" x="552" y="248" width="200" height="144" rx="6"/><text class="n" x="652" y="308" text-anchor="middle">Immutable blobs</text><text class="s" x="652" y="338" text-anchor="middle">SHA-256 + length</text><rect class="b" x="808" y="248" width="200" height="144" rx="6"/><text class="n" x="908" y="308" text-anchor="middle">Sealed manifest</text><text class="s" x="908" y="338" text-anchor="middle">completed entries only</text><rect class="b" x="1064" y="248" width="176" height="144" rx="6"/><text class="n" x="1152" y="308" text-anchor="middle">Catalog</text><text class="s" x="1152" y="338" text-anchor="middle">ready / preserved</text></g><line x1="40" y1="520" x2="1240" y2="520" stroke="#2d3142" opacity=".15"/><text class="e" x="40" y="556">INTAKE SUCCESS ≠ SEMANTIC READINESS · UNKNOWN BYTES STAY PRESERVED · NO SOURCE WRITES</text></svg>
