<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="import-flow-title import-flow-desc">
  <title id="import-flow-title">Immutable import flow</title><desc id="import-flow-desc">User-selected files stream through bounded intake into verified immutable blobs and a sealed manifest before semantic catalog adaptation makes supported records browsable.</desc>
  <defs><marker id="if-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><style>.n{font:600 12px Geist,Arial,sans-serif;fill:#2d3142}.s{font:9px 'Geist Mono',monospace;fill:#4f5d75}.b{fill:#f5f5f5;stroke:#4f5d75;stroke-width:1}.a{fill:rgba(191,69,32,.08);stroke:#bf4520;stroke-width:1.2}.e{font:8px 'Geist Mono',monospace;fill:#5a6580;letter-spacing:1px}</style></defs><rect width="1280" height="720" fill="#f5f5f5"/>
  <line x1="240" y1="320" x2="296" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#if-arrow)"/><line x1="496" y1="320" x2="552" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#if-arrow)"/><line x1="752" y1="320" x2="808" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#if-arrow)"/><line x1="1008" y1="320" x2="1064" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#if-arrow)"/>
  <rect class="b" x="40" y="248" width="200" height="144" rx="6"/><text class="n" x="140" y="308" text-anchor="middle">Selected source</text><text class="s" x="140" y="338" text-anchor="middle">directory or ZIP</text>
  <rect class="a" x="296" y="248" width="200" height="144" rx="6"/><text class="n" x="396" y="308" text-anchor="middle">Bounded intake</text><text class="s" x="396" y="338" text-anchor="middle">quota · stream · verify</text>
  <rect class="b" x="552" y="248" width="200" height="144" rx="6"/><text class="n" x="652" y="300" text-anchor="middle">Immutable blobs</text><text class="s" x="652" y="330" text-anchor="middle">SHA-256 + length</text><text class="s" x="652" y="354" text-anchor="middle">no replacement</text>
  <rect class="b" x="808" y="248" width="200" height="144" rx="6"/><text class="n" x="908" y="300" text-anchor="middle">Sealed manifest</text><text class="s" x="908" y="330" text-anchor="middle">completed entries only</text><text class="s" x="908" y="354" text-anchor="middle">source stays untouched</text>
  <rect class="b" x="1064" y="248" width="176" height="144" rx="6"/><text class="n" x="1152" y="300" text-anchor="middle">Catalog</text><text class="s" x="1152" y="330" text-anchor="middle">transactional</text><text class="s" x="1152" y="354" text-anchor="middle">ready / preserved</text>
  <line x1="40" y1="520" x2="1240" y2="520" stroke="#2d3142" stroke-opacity=".15"/><text class="e" x="40" y="556">INTAKE SUCCESS ≠ SEMANTIC READINESS</text><text class="e" x="520" y="556">UNKNOWN BYTES REMAIN PRESERVED</text><text class="e" x="960" y="556">NO SOURCE WRITES</text>
</svg>
