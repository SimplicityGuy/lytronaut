" y="112" width="416" height="432" rx="8"/><text class="e" x="848" y="140">OPERATOR-OWNED</text><line x1="248" y1="320" x2="336" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rah-a)"/><line x1="536" y1="320" x2="600" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rah-a)"/><path d="M700 256V248Q700 240 692 240H676Q668 240 668 232V224" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#rah-a)"/><path d="M700 384V440Q700 448 708 448H824" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#rah-c)"/><line x1="1024" y1="448" x2="1048" y2="448" stroke="#bf4520" stroke-width="1.2" marker-end="url(#rah-c)"/><g><rect class="b" x="48" y="256" width="200" height="128" rx="6"/><text class="n" x="148" y="310" text-anchor="middle">Portable bundle</text><text class="s" x="148" y="340" text-anchor="middle">catalog + originals</text><rect class="b" x="336" y="256" width="200" height="128" rx="6"/><text class="n" x="436" y="310" text-anchor="middle">Restore result</text><text class="s" x="436" y="340" text-anchor="middle">JOB.restored/store</text><rect class="a" x="600" y="256" width="200" height="128" rx="6"/><text class="n" x="700" y="310" text-anchor="middle">Verify copy</text><text class="s" x="700" y="340" text-anchor="middle">isolated · inactive</text><rect class="b" x="568" y="160" width="200" height="64" rx="6"/><text class="n" x="668" y="188" text-anchor="middle">Delete job</text><text class="s" x="668" y="210" text-anchor="middle">removes result</text><rect class="b" x="824" y="400" width="200" height="96" rx="6"/><text class="n" x="924" y="442" text-anchor="middle">Copy/adopt</text><text class="s" x="924" y="468" text-anchor="middle">outside job path</text><rect class="b" x="1048" y="400" width="168" height="96" rx="6"/><text class="n" x="1132" y="442" text-anchor="middle">Activate</text><text class="s" x="1132" y="468" text-anchor="middle">explicit config</text></g><line x1="40" y1="612" x2="1240" y2="612" stroke="#2d3142" opacity=".15"/><text class="e" x="64" y="648">RESTORE NEVER REPLACES ACTIVE STATE · ADOPT BEFORE DELETE</text></svg></div></main></body></html>
