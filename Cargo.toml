[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/lytronaut-contracts", "crates/lytronaut-format", "crates/lytronaut-storage", "crates/lytronaut-service"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
description = "an explorer for your light-field library"
repository = "https://github.com/SimplicityGuy/lytronaut"
publish = false

[workspace.dependencies]
lytronaut-contracts = { path = "crates/lytronaut-contracts" }
lytronaut-format = { path = "crates/lytronaut-format" }
lytronaut-storage = { path = "crates/lytronaut-storage" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "any", "tls-rustls-ring-webpki"] }
leptos = { version = "=0.8.22", default-features = false, features = ["csr"] }
wasm-bindgen = "=0.2.129"

[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.lints.clippy]
all = "warn"
