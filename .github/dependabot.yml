# Cargo, Actions and browser-test npm tooling are present. Add container ecosystems
# when Dockerfile/compose manifests land. Tool pins in mise are updated separately.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Los_Angeles
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, rust]
    assignees: [SimplicityGuy]
    groups:
      cargo-version-updates:
        applies-to: version-updates
        patterns: ['*']
      cargo-security-updates:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Los_Angeles
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies, ci]
    assignees: [SimplicityGuy]
    groups:
      actions-version-updates:
        applies-to: version-updates
        patterns: ['*']
      actions-security-updates:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: npm
    directory: /scripts/browser
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Los_Angeles
    commit-message:
      prefix: test
      include: scope
    labels: [dependencies, ci]
    assignees: [SimplicityGuy]
    groups:
      browser-version-updates:
        applies-to: version-updates
        patterns: ['*']
      browser-security-updates:
        applies-to: security-updates
        patterns: ['*']
