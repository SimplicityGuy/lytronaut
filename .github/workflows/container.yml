name: Linux containers
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    name: container-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      LYTRONAUT_TEST_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Prepare evidence directory outside the checkout
        run: |
          evidence_directory="$RUNNER_TEMP/lytronaut-container-evidence"
          mkdir -p "$evidence_directory"
          printf 'LYTRONAUT_EVIDENCE_DIRECTORY=%s\n' "$evidence_directory" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - run: mise exec -- just setup
      - run: mise exec -- cargo build --locked -p lytronaut-service --example synthetic_jpeg
      - run: docker compose config --quiet
      - name: Build exact source image and test ingress relay
        run: mise exec -- just container-build "${{ matrix.arch }}" lytronaut:ci lytronaut:smoke-relay "$LYTRONAUT_TEST_REVISION" 2>&1 | tee "$LYTRONAUT_EVIDENCE_DIRECTORY/build.log"
      - name: Freeze exact programs and image
        run: mise exec -- just container-artifacts "${{ matrix.arch }}" lytronaut:ci "$LYTRONAUT_EVIDENCE_DIRECTORY"
      - name: Runtime and package inventory
        run: mise exec -- just container-smoke "${{ matrix.arch }}" lytronaut:ci lytronaut:smoke-relay "$LYTRONAUT_TEST_REVISION" "$LYTRONAUT_EVIDENCE_DIRECTORY"
      - name: Verify native architecture, source and exercised programs
        run: mise exec -- just container-evidence "${{ matrix.arch }}" "$LYTRONAUT_TEST_REVISION" "$LYTRONAUT_EVIDENCE_DIRECTORY"
      - name: Synthetic fixtures from the same cached build
        run: mise exec -- just synthetic-fixtures "${{ matrix.arch }}" "$RUNNER_TEMP/lytronaut-fixtures"
      - name: SQLite, PostgreSQL and external PostgreSQL Compose deployments with cross-backend restore
        env:
          LYTRONAUT_TEST_PREFIX: lytronaut-ci-deploy
          LYTRONAUT_TEST_SCRATCH: ${{ runner.temp }}
        run: mise exec -- just deployment-test "${{ matrix.arch }}" lytronaut:ci bind "$RUNNER_TEMP/lytronaut-fixtures" "$LYTRONAUT_EVIDENCE_DIRECTORY"
      - name: Preserve available evidence, including failed runs
        id: bundle
        if: always()
        run: mise exec -- just container-bundle "$LYTRONAUT_EVIDENCE_DIRECTORY" "${{ runner.temp }}/lytronaut-container-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.bundle.outcome == 'success'
        with:
          name: lytronaut-container-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lytronaut-container-${{ matrix.arch }}.tar.gz
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
