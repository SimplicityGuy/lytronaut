name: coverage

# First-party line coverage gate: native (stable + cargo-llvm-cov) and the actual
# Rust/WASM client instrumented with a dated nightly, both executed by the real
# synthetic browser suites. Fails below 95% native, WASM(client) or union, or on
# any failed test. Synthetic fixtures only; no secrets; nothing is published.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sidebar_repetitions:
        description: 'Opt-in instrumented sidebar suites (20..50; 0 disables)'
        required: false
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      MISE_ENV: coverage
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      LYTRONAUT_CHROME: /usr/bin/google-chrome
      LYTRONAUT_TEST_PREFIX: lytronaut-ci-coverage
      # Bind evidence to the exact branch commit, not the PR merge ref.
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SIDEBAR_REPETITIONS: ${{ inputs.sidebar_repetitions || '0' }}
    steps:
      - name: Bound instrumented repetitions before building
        run: '[[ "$SIDEBAR_REPETITIONS" =~ ^(0|2[0-9]|[34][0-9]|50)$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Free runner disk for instrumented targets
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - run: mise exec -- just setup
      - name: Coverage toolchains (stable llvm-tools, dated nightly for WASM)
        run: mise exec -- just coverage-toolchain
      - name: Instrumented Rust/WASM clients
        run: mise exec -- just coverage-wasm
      - name: Instrumented native tests, binaries and PostgreSQL parity
        run: mise exec -- just coverage-native
      - name: Consecutive instrumented sidebar suites (no retries)
        if: ${{ inputs.sidebar_repetitions != '' && inputs.sidebar_repetitions != '0' }}
        run: |
          source target/coverage/native-env.sh
          npm ci --ignore-scripts --prefix scripts/browser
          LYTRONAUT_CLIENT="$PWD/target/coverage/wasm/client/dist" \
            LYTRONAUT_COVERAGE_DIR="$PWD/target/coverage/wasm/client/profraw" \
            LYTRONAUT_TEST_REVISION="$SOURCE_SHA" \
            LYTRONAUT_SIDEBAR_REPETITIONS="$SIDEBAR_REPETITIONS" \
            LYTRONAUT_SIDEBAR_LIFECYCLE=1 \
            mise exec -- bash scripts/browser-test.sh
      - name: Browser suites against the instrumented service and clients
        run: mise exec -- just coverage-browser
      - name: Coverage report and 95% floors
        if: ${{ !cancelled() }}
        run: mise exec -- just coverage-report
      - name: Package synthetic coverage evidence
        if: ${{ !cancelled() }}
        run: |
          cd target/coverage || exit 0
          files=()
          for path in report meta native.lcov wasm/*/coverage.lcov wasm/*/scripts/*.lcov wasm/*/*.stderr wasm/*/profraw/driver-*.json; do
            if [[ -e $path ]]; then files+=("$path"); fi
          done
          [[ ${#files[@]} -gt 0 ]] || exit 0
          tar -czf "$GITHUB_WORKSPACE/coverage-evidence.tar.gz" "${files[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('coverage-evidence.tar.gz') != '' }}
        with:
          name: coverage-${{ env.SOURCE_SHA }}
          path: coverage-evidence.tar.gz
          if-no-files-found: error
          compression-level: 0
