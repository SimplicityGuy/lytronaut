[package]
name = "lytronaut-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[lib]
crate-type = ["cdylib", "rlib"]
[features]
default = []
# Explicit synthetic lifecycle harness; absent from normal application artifacts.
test-harness = ["lytronaut-format/test-harness", "lytronaut-contracts/test-harness"]
# Coverage tooling only: links the LLVM counter export hook into the instrumented
# browser build made by `just coverage-wasm`. Never part of production or
# test-harness artifacts; `just dependencies` rejects it in the default graph.
coverage = ["dep:lytronaut-coverage"]
[dependencies]
lytronaut-contracts.workspace = true
lytronaut-format.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.11.0"
[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos.workspace = true
wasm-bindgen.workspace = true

wgpu = { version = "=30.0.1", default-features = false, features = ["webgpu", "wgsl"] }
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["Window", "Document", "HtmlInputElement", "HtmlAnchorElement", "File", "FileList", "Blob", "BlobPropertyBag", "Url", "Request", "RequestInit", "RequestCredentials", "Response", "Headers", "AbortController", "AbortSignal", "ReadableStream", "ReadableStreamDefaultReader", "XmlHttpRequest", "XmlHttpRequestUpload", "ProgressEvent", "Event", "EventTarget", "KeyboardEvent", "Storage", "Location", "HtmlImageElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "Element", "ImageData", "Performance", "PerformanceMark", "VideoDecoder", "VideoDecoderInit", "VideoDecoderConfig", "VideoDecoderSupport", "EncodedVideoChunk", "EncodedVideoChunkInit", "EncodedVideoChunkType", "VideoFrame", "HardwareAcceleration", "DomRectReadOnly"] }
futures = "=0.3.34"
lytronaut-coverage = { path = "../lytronaut-coverage", optional = true }
